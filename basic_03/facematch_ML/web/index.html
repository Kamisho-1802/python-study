<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>有名人そっくり判定</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      max-width: 480px;
      margin: 0 auto;
      padding: 16px;
      text-align: center;
    }
    h1 { font-size: 1.3rem; }
    video, canvas {
      width: 100%;
      max-width: 360px;
      border-radius: 12px;
      background: #000;
    }
    button {
      font-size: 1rem;
      padding: 12px 20px;
      margin: 12px 0;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: #fff;
      cursor: pointer;
    }
    button:disabled { background: #9ca3af; cursor: default; }
    #result { margin-top: 12px; text-align: left; }
    .match {
      display: flex;
      justify-content: space-between;
      padding: 10px 14px;
      margin: 6px 0;
      border-radius: 8px;
      background: rgba(37, 99, 235, 0.1);
    }
    .match .rank { font-weight: bold; margin-right: 8px; }
    .match .bar {
      height: 6px;
      background: #2563eb;
      border-radius: 3px;
      margin-top: 4px;
    }
    .error { color: #dc2626; font-weight: bold; }
    .hint { color: #6b7280; font-size: 0.85rem; }
    .sep { margin: 16px 0 4px; color: #6b7280; font-size: 0.85rem; }
    #preview { width: 100%; max-width: 360px; border-radius: 12px; }
  </style>
</head>
<body>
  <h1>有名人そっくり判定</h1>
  <p class="hint">1人で正面を向いた画像で判定します</p>

  <!-- (A) カメラで撮影 -->
  <video id="cam" autoplay playsinline></video>
  <canvas id="canvas" hidden></canvas>
  <div>
    <button id="shot">撮影して判定</button>
  </div>

  <!-- (B) カメラが使えない環境向け: 画像ファイルを読み込んで判定 -->
  <p class="sep">― または画像ファイルを選んで判定 ―</p>
  <div>
    <input id="fileInput" type="file" accept="image/*" />
  </div>
  <img id="preview" hidden alt="選択した画像" />

  <div id="result"></div>

  <script>
    const video = document.getElementById("cam");
    const result = document.getElementById("result");
    const shotBtn = document.getElementById("shot");
    const fileInput = document.getElementById("fileInput");
    const preview = document.getElementById("preview");

    // 内側カメラ（自撮り）を起動。HTTPS か localhost でないと動かない点に注意。
    // カメラが使えなくても、下の「画像ファイルを選んで判定」は使えるようにする。
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      navigator.mediaDevices
        .getUserMedia({ video: { facingMode: "user" } })
        .then((stream) => {
          video.srcObject = stream;
        })
        .catch((err) => {
          disableCamera(
            "カメラを起動できません (" + err.message + ")。" +
            "下の画像ファイル選択で判定できます。"
          );
        });
    } else {
      disableCamera("この環境ではカメラを使えません。下の画像ファイル選択で判定できます。");
    }

    function disableCamera(msg) {
      video.hidden = true;
      shotBtn.disabled = true;
      result.innerHTML = '<p class="hint">' + escapeHtml(msg) + "</p>";
    }

    // (A) カメラ撮影 → 判定
    shotBtn.onclick = async () => {
      if (!video.videoWidth) return;
      const canvas = document.getElementById("canvas");
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext("2d").drawImage(video, 0, 0);
      const blob = await new Promise((r) => canvas.toBlob(r, "image/jpeg", 0.9));
      if (!blob) {
        result.innerHTML = '<p class="error">画像を取得できませんでした。もう一度お試しください。</p>';
        return;
      }
      preview.hidden = true;
      await analyze(blob, "shot.jpg");
    };

    // (B) 画像ファイル選択 → 判定（カメラが無い環境でも試走できる）
    fileInput.onchange = async () => {
      const f = fileInput.files && fileInput.files[0];
      if (!f) return;
      // 選んだ画像をプレビュー表示
      preview.src = URL.createObjectURL(f);
      preview.hidden = false;
      await analyze(f, f.name || "upload.jpg");
    };

    // 共通: blob を /analyze に POST して結果を表示する
    async function analyze(blob, filename) {
      const fd = new FormData();
      fd.append("file", blob, filename);

      shotBtn.disabled = true;
      fileInput.disabled = true;
      result.innerHTML = '<p class="hint">判定中…</p>';

      try {
        const res = await fetch("/analyze", { method: "POST", body: fd });

        // サーバが JSON 以外（500 のトレースバック等）を返しても落ちないようにする
        const text = await res.text();
        let data;
        try {
          data = JSON.parse(text);
        } catch (_) {
          result.innerHTML =
            '<p class="error">サーバがエラーを返しました (HTTP ' + res.status + ")</p>" +
            '<p class="hint">' + escapeHtml(text.slice(0, 300)) + "</p>";
          return;
        }
        render(data.matches);
      } catch (e) {
        result.innerHTML = '<p class="error">通信エラー: ' + escapeHtml(e.message) + "</p>";
      } finally {
        shotBtn.disabled = !!video.hidden ? true : false;
        fileInput.disabled = false;
      }
    }

    function render(matches) {
      // エラー時は { error: "..." } が返る
      if (!Array.isArray(matches)) {
        const msg = matches && matches.error ? matches.error : "判定できませんでした";
        result.innerHTML = '<p class="error">' + msg + "</p>";
        return;
      }
      if (matches.length === 0) {
        result.innerHTML = '<p class="error">該当する有名人が見つかりませんでした</p>';
        return;
      }

      // 上位の類似度を見やすく表示（similarity は -1〜1 のコサイン類似度）
      result.innerHTML =
        "<h2>似ている有名人 TOP" + matches.length + "</h2>" +
        matches
          .map((m, i) => {
            const pct = Math.max(0, Math.min(100, Math.round(m.similarity * 100)));
            return (
              '<div class="match">' +
              '<div><span class="rank">' + (i + 1) + "位</span>" + escapeHtml(m.name) +
              '<div class="bar" style="width:' + pct + '%"></div></div>' +
              "<div>" + m.similarity.toFixed(3) + "</div>" +
              "</div>"
            );
          })
          .join("");
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => (
        { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
      ));
    }
  </script>
</body>
</html>
